[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Artisan"
version = "0.1.0"
description = ""
authors = [{ name = "Doehyun Baek", email = "doehyunbaek@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jinja2==3.1.6",
  "pymupdf4llm==0.0.27",
  "langextract==1.0.4",
  "docker==7.1.0",
  "playwright>=1.55.0",
  "mini-swe-agent",
  "sweagent",
  "swe-rex",
  "requests-cache>=1.2.1",
  "requests>=2.31.0,<3",
  "matplotlib>=3.10.7",
  "tabulate>=0.9.0",
  "datasets>=4.2.0",
  "mitmproxy>=12.2.1",
  "openhands-ai>=1.0.0",
  "openhands-sdk",
  "openhands-tools",
  "openhands-workspace",
  "openhands-agent-server",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artisan"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[project.scripts]
artisan = "artisan.cli:main"

[tool.uv.sources]
"mini-swe-agent" = { path = "agents/mini-swe-agent", editable = true }
"sweagent" = { path = "agents/SWE-agent", editable = true }

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "agents"
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
]
markers = [
  "network: mark test as making a real network request",
  "llm: mark test as exercising LLM",
]
testpaths = [
  "tests",
]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
